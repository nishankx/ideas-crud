basePath: /api/v1
definitions:
  domain.CauseBreakdownItem:
    properties:
      cause:
        $ref: '#/definitions/domain.DeathCause'
      co_occurring:
        items:
          $ref: '#/definitions/domain.CoOccurringCause'
        type: array
      count:
        type: integer
      share:
        type: number
    type: object
  domain.CausesResponse:
    properties:
      causes:
        items:
          $ref: '#/definitions/domain.CauseBreakdownItem'
        type: array
      total:
        type: integer
    type: object
  domain.CoOccurringCause:
    properties:
      cause:
        $ref: '#/definitions/domain.DeathCause'
      count:
        type: integer
    type: object
  domain.DeathCause:
    enum:
    - no_market_need
    - ran_out_of_money
    - ran_out_of_time
    - lost_motivation
    - competitor
    - technical_difficulty
    - cofounder_conflict
    - legal_regulatory
    - bad_timing
    - pivoted_away
    - other
    type: string
    x-enum-varnames:
    - CauseNoMarketNeed
    - CauseRanOutOfMoney
    - CauseRanOutOfTime
    - CauseLostMotivation
    - CauseCompetitor
    - CauseTechnicalDifficulty
    - CauseCofounderConflict
    - CauseLegalRegulatory
    - CauseBadTiming
    - CausePivotedAway
    - CauseOther
  domain.Idea:
    properties:
      autopsy:
        type: string
      born_at:
        type: string
      category:
        $ref: '#/definitions/domain.IdeaCategory'
      created_at:
        type: string
      description:
        type: string
      died_at:
        type: string
      epitaph:
        type: string
      hours_invested:
        type: integer
      id:
        type: string
      money_spent_cents:
        type: integer
      name:
        type: string
      primary_cause:
        $ref: '#/definitions/domain.DeathCause'
      secondary_causes:
        items:
          $ref: '#/definitions/domain.DeathCause'
        type: array
      status:
        $ref: '#/definitions/domain.IdeaStatus'
      tagline:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      validation_level:
        $ref: '#/definitions/domain.ValidationLevel'
      would_resurrect:
        type: boolean
    type: object
  domain.IdeaCategory:
    enum:
    - saas
    - marketplace
    - consumer
    - devtool
    - hardware
    - fintech
    - health
    - education
    - social
    - other
    type: string
    x-enum-varnames:
    - CategorySaaS
    - CategoryMarketplace
    - CategoryConsumer
    - CategoryDevtool
    - CategoryHardware
    - CategoryFintech
    - CategoryHealth
    - CategoryEducation
    - CategorySocial
    - CategoryOther
  domain.IdeaStatus:
    enum:
    - buried
    - on_life_support
    - resurrected
    type: string
    x-enum-varnames:
    - StatusBuried
    - StatusOnLifeSupport
    - StatusResurrected
  domain.InsightsSummary:
    properties:
      avg_lifespan_days:
        type: number
      most_common_cause:
        $ref: '#/definitions/domain.DeathCause'
      most_lethal_category:
        $ref: '#/definitions/domain.IdeaCategory'
      total_hours_lost:
        type: integer
      total_ideas:
        type: integer
      total_money_lost_cents:
        type: integer
    type: object
  domain.LifespanBucket:
    properties:
      bucket:
        type: string
      count:
        type: integer
      label:
        type: string
      share:
        type: number
    type: object
  domain.LifespanResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/domain.LifespanBucket'
        type: array
      total:
        type: integer
    type: object
  domain.PaginatedIdeas:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/domain.Idea'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  domain.PatternObservation:
    properties:
      id:
        type: string
      message:
        type: string
      sample_size:
        type: integer
      severity:
        description: info | warning | critical
        type: string
      title:
        type: string
    type: object
  domain.PatternsResponse:
    properties:
      patterns:
        items:
          $ref: '#/definitions/domain.PatternObservation'
        type: array
    type: object
  domain.TimelineBucket:
    properties:
      count:
        type: integer
      month:
        type: string
    type: object
  domain.TimelineResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/domain.TimelineBucket'
        type: array
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_demo:
        type: boolean
    type: object
  domain.ValidationLevel:
    enum:
    - none
    - talked_to_users
    - prototype
    - paying_customers
    type: string
    x-enum-varnames:
    - ValidationNone
    - ValidationTalkedToUsers
    - ValidationPrototype
    - ValidationPayingCustomers
  domain.ValidationMatrixRow:
    properties:
      causes:
        additionalProperties:
          type: integer
        type: object
      total:
        type: integer
      validation_level:
        $ref: '#/definitions/domain.ValidationLevel'
    type: object
  domain.ValidationResponse:
    properties:
      matrix:
        items:
          $ref: '#/definitions/domain.ValidationMatrixRow'
        type: array
    type: object
  handler.AuthResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  handler.CreateIdeaRequest:
    properties:
      autopsy:
        maxLength: 5000
        type: string
      born_at:
        type: string
      category:
        $ref: '#/definitions/domain.IdeaCategory'
      description:
        maxLength: 5000
        type: string
      died_at:
        type: string
      epitaph:
        maxLength: 140
        minLength: 1
        type: string
      hours_invested:
        minimum: 0
        type: integer
      money_spent_cents:
        minimum: 0
        type: integer
      name:
        maxLength: 120
        minLength: 1
        type: string
      primary_cause:
        $ref: '#/definitions/domain.DeathCause'
      secondary_causes:
        items:
          $ref: '#/definitions/domain.DeathCause'
        type: array
      tagline:
        maxLength: 200
        type: string
      validation_level:
        $ref: '#/definitions/domain.ValidationLevel'
      would_resurrect:
        type: boolean
    required:
    - born_at
    - category
    - died_at
    - epitaph
    - name
    - primary_cause
    type: object
  handler.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  handler.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.RegisterRequest:
    properties:
      display_name:
        maxLength: 64
        minLength: 2
        type: string
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - display_name
    - email
    - password
    type: object
  handler.UpdateIdeaRequest:
    properties:
      autopsy:
        maxLength: 5000
        type: string
      born_at:
        type: string
      category:
        $ref: '#/definitions/domain.IdeaCategory'
      description:
        maxLength: 5000
        type: string
      died_at:
        type: string
      epitaph:
        maxLength: 140
        minLength: 1
        type: string
      hours_invested:
        minimum: 0
        type: integer
      money_spent_cents:
        minimum: 0
        type: integer
      name:
        maxLength: 120
        minLength: 1
        type: string
      primary_cause:
        $ref: '#/definitions/domain.DeathCause'
      secondary_causes:
        items:
          $ref: '#/definitions/domain.DeathCause'
        type: array
      status:
        $ref: '#/definitions/domain.IdeaStatus'
      tagline:
        maxLength: 200
        type: string
      validation_level:
        $ref: '#/definitions/domain.ValidationLevel'
      would_resurrect:
        type: boolean
    type: object
info:
  contact: {}
  description: API for burying abandoned startup ideas and analyzing failure patterns.
  title: Startup Idea Graveyard API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Revoke refresh session and clear cookie
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - auth
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Rotate refresh cookie and issue a new access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Register a new account
      tags:
      - auth
  /demo/ideas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedIdeas'
      summary: List public demo graveyard ideas
      tags:
      - demo
  /demo/ideas/{id}:
    get:
      parameters:
      - description: Idea UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Idea'
      summary: Get a single public demo idea
      tags:
      - demo
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - ops
  /ideas:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Primary cause filter
        in: query
        name: cause
        type: string
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Validation level filter
        in: query
        name: validation
        type: string
      - description: Died after YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: Died before YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: Full-text search query
        in: query
        name: q
        type: string
      - description: Sort field (died_at, created_at, money_spent, lifespan)
        in: query
        name: sort
        type: string
      - description: Sort direction (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedIdeas'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List buried ideas with filters, full-text search, and pagination
      tags:
      - ideas
    post:
      consumes:
      - application/json
      parameters:
      - description: Idea payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateIdeaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Idea'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Bury a new startup idea
      tags:
      - ideas
  /ideas/{id}:
    delete:
      parameters:
      - description: Idea UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Soft-delete a buried idea
      tags:
      - ideas
    get:
      parameters:
      - description: Idea UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Idea'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a single buried idea by ID
      tags:
      - ideas
    patch:
      consumes:
      - application/json
      parameters:
      - description: Idea UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateIdeaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Idea'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a buried idea
      tags:
      - ideas
  /ideas/{id}/resurrect:
    post:
      parameters:
      - description: Idea UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Idea'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Advance idea status (buried -> on_life_support -> resurrected)
      tags:
      - ideas
  /insights/causes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CausesResponse'
      security:
      - BearerAuth: []
      summary: Get cause-of-death breakdown and co-occurring secondary causes
      tags:
      - insights
  /insights/lifespan:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LifespanResponse'
      security:
      - BearerAuth: []
      summary: Get lifespan distribution buckets
      tags:
      - insights
  /insights/patterns:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PatternsResponse'
      security:
      - BearerAuth: []
      summary: Get server-side plain-English failure patterns
      tags:
      - insights
  /insights/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.InsightsSummary'
      security:
      - BearerAuth: []
      summary: Get aggregate graveyard summary stats
      tags:
      - insights
  /insights/timeline:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TimelineResponse'
      security:
      - BearerAuth: []
      summary: Get monthly burial counts
      tags:
      - insights
  /insights/validation:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ValidationResponse'
      security:
      - BearerAuth: []
      summary: Get validation level vs cause-of-death matrix
      tags:
      - insights
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorEnvelope'
      summary: Readiness probe
      tags:
      - ops
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
