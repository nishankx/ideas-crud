app = "gravehard-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  COOKIE_SECURE = "true"
  RATE_LIMIT_GENERAL_RPM = "120"
  RATE_LIMIT_AUTH_RPM = "20"
  RATE_LIMIT_DEMO_RPM = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"
